name: VS18-CI

on: [push, pull_request]

jobs:
  ci:
    name: windows-vs18
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gen: Visual Studio 18 2026, arch: x64, shared: ON}
          - {gen: Visual Studio 18 2026, arch: x64, shared: OFF}
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: Configure
      run: |
        cmake -G "${{matrix.gen}}" -A ${{matrix.arch}} -B build
    - name: Build Debug
      run: cmake --build build --config Debug --verbose
    - name: Build Release
      run: cmake --build build --config Release --verbose